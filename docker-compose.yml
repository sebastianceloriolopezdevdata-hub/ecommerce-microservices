services:

  products-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-products-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_CNN: mongodb://admin:admin123@mongodb:27017/ecommerce_core?authSource=admin
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ecommerce_core
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: